name: Instrumented Tests

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Emulator jobs are slow; do not stack them up on rapid pushes.
concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uninstall-protection:
    name: Uninstall protection (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        # minSdk, a mid version, and targetSdk. AOSP images only - this cannot
        # cover Samsung/MIUI, which reimplement the Settings screens under test.
        api-level: [ 29, 33, 35 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # testOnly lets `dpm remove-active-admin` force-remove the admin during
      # cleanup; without it forceRemoveActiveAdmin refuses with SecurityException.
      - name: Build debug + test APKs
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon \
            -Pandroid.injected.testOnly=true

      - name: Run device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb logcat -c
            adb logcat > logcat-${{ matrix.api-level }}.txt &
            bash scripts/uninstall-protection-e2e.sh
            ./gradlew connectedDebugAndroidTest --no-daemon -Pandroid.injected.testOnly=true

      - name: Upload instrumentation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-results-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/
            logcat-${{ matrix.api-level }}.txt
          retention-days: 7
